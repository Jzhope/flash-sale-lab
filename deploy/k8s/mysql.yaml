apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - {name: MYSQL_DATABASE, value: flashsale}
            - {name: MYSQL_USER, value: flashsale}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: flash-sale-secrets, key: DB_PASSWORD}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: flash-sale-secrets, key: MYSQL_ROOT_PASSWORD}
            - {name: TZ, value: UTC}
          ports: [{containerPort: 3306}]
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u flashsale -D flashsale -e "SELECT 1"']
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: mysql}
  ports: [{port: 3306}]
